name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Toolchain comes from rust-toolchain.toml, so `-D warnings` can't be broken
  # by a new stable release landing a new lint.
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all

  # Early warning for lints and behavior changes arriving in the next stable.
  # Allowed to fail: it tells us to schedule work, it does not block a PR.
  beta:
    name: beta (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      RUSTUP_TOOLCHAIN: beta
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install beta --profile minimal --component clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all

  # Advisories, license compatibility, and source trust over the whole tree.
  # Config and rationale live in deny.toml.
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  # Floor is set just under the first measured value (50.76% lines) so it blocks
  # regression without pretending the current number is a target. Raise it when
  # coverage genuinely improves. Worst gaps today: main.rs 0%, upbit.rs 29%.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup show && rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - run: cargo llvm-cov --workspace --summary-only --fail-under-lines 50
