[package]
name = "rustle"
version = "0.1.0"
edition = "2021"
description = "Local, public-data-only Upbit signal study CLI"
license = "Apache-2.0"
repository = "https://github.com/skyoo2003/rustle"
readme = "../README.md"
keywords = ["upbit", "orderbook", "microstructure", "trading", "cli"]
categories = ["command-line-utilities", "finance"]
publish = false

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
rand = "0.8"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
arrow-array = "53"
arrow-schema = "53"
parquet = { version = "53", features = ["arrow"] }

[dev-dependencies]
tempfile = "3"
