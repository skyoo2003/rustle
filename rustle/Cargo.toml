[package]
name = "rustle"
version = "0.1.0"
edition = "2021"
# Tracks the toolchain pinned in rust-toolchain.toml. Not a researched floor —
# nothing has been tested against older compilers.
rust-version = "1.98"
description = "Local, public-data-only Upbit signal study CLI"
license = "Apache-2.0"
repository = "https://github.com/skyoo2003/rustle"
readme = "../README.md"
keywords = ["upbit", "orderbook", "microstructure", "trading", "cli"]
categories = ["command-line-utilities", "finance"]
publish = false

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
rand = "0.10"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "test-util"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
arrow-array = "59"
arrow-schema = "59"
# 59 is the first parquet release that drops the `thrift` dependency, which is
# how CVE-2026-43868 (thrift 0.17, no patch below 0.23) reached this tree.
parquet = { version = "59", features = ["arrow"] }

[dev-dependencies]
tempfile = "3"

# "You can tell why it did that" is the point of this project, so the compiler
# enforces it rather than a paragraph in CONTRIBUTING.md.
[lints.rust]
unsafe_code = "forbid"
